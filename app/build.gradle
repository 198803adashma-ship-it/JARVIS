plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }

        debug {
            minifyEnabled false
        }
    }
}

dependencies {
}
