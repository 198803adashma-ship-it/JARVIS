name: JARVIS Offline APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/jarvis/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVIS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jarvis.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '4.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#00FF00</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="JARVIS"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jarvis/app/MainActivity.java <<'EOF'
          package com.jarvis.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextView status;
              private TextView result;
              private TextToSpeech tts;
              private SpeechRecognizer speechRecognizer;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(35, 35, 35, 35);

                  status = new TextView(this);
                  status.setText("J.A.R.V.I.S ONLINE");
                  status.setTextSize(28);
                  status.setGravity(Gravity.CENTER);

                  result = new TextView(this);
                  result.setText("Men tayyorman.");
                  result.setTextSize(20);
                  result.setGravity(Gravity.CENTER);
                  result.setPadding(0, 40, 0, 40);

                  Button speakButton = new Button(this);
                  speakButton.setText("🎤 GAPIRISH");
                  speakButton.setTextSize(20);

                  layout.addView(status);
                  layout.addView(result);
                  layout.addView(speakButton);

                  setContentView(layout);

                  tts = new TextToSpeech(this, success -> {
                      if (success == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("en", "US"));
                          speak("JARVIS online.");
                      }
                  });

                  speakButton.setOnClickListener(v -> startListening());

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.RECORD_AUDIO},
                              100
                      );
                  }
              }

              private void startListening() {

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      speak("Speech recognition is not available.");
                      return;
                  }

                  status.setText("🎤 LISTENING...");

                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);

                  speechRecognizer.setRecognitionListener(
                          new android.speech.RecognitionListener() {

                      @Override
                      public void onResults(Bundle bundle) {
                          ArrayList<String> matches =
                                  bundle.getStringArrayList(
                                          SpeechRecognizer.RESULTS_RECOGNITION
                                  );

                          if (matches != null && !matches.isEmpty()) {
                              String command = matches.get(0);
                              result.setText(command);
                              handleCommand(command);
                          }

                          status.setText("J.A.R.V.I.S ONLINE");
                      }

                      @Override public void onReadyForSpeech(Bundle b) {}
                      @Override public void onBeginningOfSpeech() {}
                      @Override public void onRmsChanged(float v) {}
                      @Override public void onBufferReceived(byte[] b) {}
                      @Override public void onEndOfSpeech() {}
                      @Override public void onError(int i) {
                          status.setText("J.A.R.V.I.S ONLINE");
                          speak("I did not understand.");
                      }
                      @Override public void onPartialResults(Bundle b) {}
                      @Override public void onEvent(int i, Bundle b) {}
                  });

                  Intent intent = new Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                  );

                  intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE,
                          Locale.getDefault()
                  );

                  intent.putExtra(
                          RecognizerIntent.EXTRA_PROMPT,
                          "Speak to JARVIS"
                  );

                  speechRecognizer.startListening(intent);
              }

              private void handleCommand(String command) {

                  String c = command.toLowerCase(Locale.ROOT);

                  if (c.contains("hello") ||
                      c.contains("salom")) {

                      speak("Hello. I am JARVIS. How can I help you?");
                  }

                  else if (c.contains("your name") ||
                           c.contains("isming")) {

                      speak("My name is JARVIS.");
                  }

                  else if (c.contains("youtube")) {

                      speak("Opening YouTube.");

                      Intent intent = new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("https://www.youtube.com/")
                      );

                      startActivity(intent);
                  }

                  else if (c.contains("google") ||
                           c.contains("internet") ||
                           c.contains("brauzer")) {

                      speak("Opening the internet.");

                      Intent intent = new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("https://www.google.com/")
                      );

                      startActivity(intent);
                  }

                  else if (c.contains("camera") ||
                           c.contains("kamera")) {

                      speak("Opening camera.");

                      Intent intent = new Intent(
                              "android.media.action.IMAGE_CAPTURE"
                      );

                      startActivity(intent);
                  }

                  else if (c.contains("time") ||
                           c.contains("soat") ||
                           c.contains("vaqt")) {

                      java.text.SimpleDateFormat format =
                              new java.text.SimpleDateFormat(
                                      "HH:mm",
                                      Locale.getDefault()
                              );

                      speak("The time is " + format.format(
                              new java.util.Date()
                      ));
                  }

                  else if (c.contains("who are you") ||
                           c.contains("kim") ||
                           c.contains("jarvis")) {

                      speak("I am JARVIS, your personal Android assistant.");
                  }

                  else {

                      speak("I heard you say: " + command);
                  }
              }

              private void speak(String text) {

                  result.setText(text);

                  if (tts != null) {
                      tts.speak(
                              text,
                              TextToSpeech.QUEUE_FLUSH,
                              null,
                              "JARVIS"
                      );
                  }
              }

              @Override
              protected void onDestroy() {

                  if (speechRecognizer != null) {
                      speechRecognizer.destroy();
                  }

                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build APK
        run: ./gradlew clean assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          file app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
EOF
