name: JARVIS AI Test

on:
  workflow_dispatch:

jobs:
  test-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI
        run: pip install openai

      - name: Test JARVIS AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          from openai import OpenAI

          client = OpenAI()

          response = client.responses.create(
              model="gpt-5.6-luna",
              input="Salom JARVIS. O'zingni qisqa tanishtir."
          )

          print("JARVIS:")
          print(response.output_text)
          PY
