name: JARVIS Fixed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/jarvis/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVIS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jarvis.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 10
                  versionName '10.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#00FF00</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="JARVIS"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/jarvis/app/MainActivity.java <<'EOF'
          package com.jarvis.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextView status;
              private TextView answer;
              private TextToSpeech tts;
              private SpeechRecognizer recognizer;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(30, 30, 30, 30);

                  status = new TextView(this);
                  status.setText("J.A.R.V.I.S ONLINE");
                  status.setTextSize(28);
                  status.setGravity(Gravity.CENTER);

                  answer = new TextView(this);
                  answer.setText("Hello. I am JARVIS.");
                  answer.setTextSize(20);
                  answer.setGravity(Gravity.CENTER);
                  answer.setPadding(0, 40, 0, 40);

                  Button button = new Button(this);
                  button.setText("🎤  GAPIRISH");
                  button.setTextSize(20);

                  layout.addView(status);
                  layout.addView(answer);
                  layout.addView(button);

                  setContentView(layout);

                  tts = new TextToSpeech(this, result -> {
                      if (result == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.US);
                          speak("JARVIS online.");
                      }
                  });

                  button.setOnClickListener(v -> listen());

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.RECORD_AUDIO},
                              100
                      );
                  }
              }

              private void listen() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      speak("Speech recognition is not available.");
                      return;
                  }

                  status.setText("LISTENING...");

                  recognizer = SpeechRecognizer.createSpeechRecognizer(this);

                  recognizer.setRecognitionListener(
                          new android.speech.RecognitionListener() {

                      @Override
                      public void onResults(Bundle bundle) {
                          ArrayList<String> list =
                                  bundle.getStringArrayList(
                                          SpeechRecognizer.RESULTS_RECOGNITION
                                  );

                          if (list != null && !list.isEmpty()) {
                              String command = list.get(0);
                              answer.setText(command);
                              command(command);
                          }

                          status.setText("J.A.R.V.I.S ONLINE");
                      }

                      @Override public void onReadyForSpeech(Bundle b) {}
                      @Override public void onBeginningOfSpeech() {}
                      @Override public void onRmsChanged(float v) {}
                      @Override public void onBufferReceived(byte[] b) {}
                      @Override public void onEndOfSpeech() {}
                      @Override public void onPartialResults(Bundle b) {}
                      @Override public void onEvent(int i, Bundle b) {}

                      @Override
                      public void onError(int error) {
                          status.setText("J.A.R.V.I.S ONLINE");
                          speak("I did not understand.");
                      }
                  });

                  Intent intent = new Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                  );

                  intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE,
                          Locale.getDefault()
                  );

                  intent.putExtra(
                          RecognizerIntent.EXTRA_PROMPT,
                          "Speak to JARVIS"
                  );

                  recognizer.startListening(intent);
              }

              private void command(String text) {
                  String c = text.toLowerCase(Locale.ROOT);

                  if (c.contains("salom") || c.contains("hello")) {
                      speak("Hello. How can I help you?");
                  }

                  else if (c.contains("isming") ||
                           c.contains("your name")) {
                      speak("My name is JARVIS.");
                  }

                  else if (c.contains("soat") ||
                           c.contains("vaqt") ||
                           c.contains("time")) {

                      SimpleDateFormat format =
                              new SimpleDateFormat(
                                      "HH:mm",
                                      Locale.getDefault()
                              );

                      speak("The time is " +
                              format.format(new Date()));
                  }

                  else if (c.contains("youtube")) {
                      speak("Opening YouTube.");

                      startActivity(new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("https://www.youtube.com/")
                      ));
                  }

                  else if (c.contains("google") ||
                           c.contains("internet")) {

                      speak("Opening Google.");

                      startActivity(new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("https://www.google.com/")
                      ));
                  }

                  else if (c.contains("kamera") ||
                           c.contains("camera")) {

                      speak("Opening camera.");

                      startActivity(new Intent(
                              "android.media.action.IMAGE_CAPTURE"
                      ));
                  }

                  else {
                      speak("I heard you say: " + text);
                  }
              }

              private void speak(String text) {
                  answer.setText(text);

                  if (tts != null) {
                      tts.speak(
                              text,
                              TextToSpeech.QUEUE_FLUSH,
                              null,
                              "JARVIS"
                      );
                  }
              }

              @Override
              protected void onDestroy() {
                  if (recognizer != null) {
                      recognizer.destroy();
                  }

                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build signed debug APK
        run: ./gradlew clean assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "===== APK INFO ====="
          ls -lh "$APK"
          file "$APK"

          echo "===== APK CONTENT TEST ====="
          unzip -t "$APK" > /dev/null

          echo "===== APK SHA256 ====="
          sha256sum "$APK"

          echo "===== APK SIZE ====="
          stat -c%s "$APK"

          test -s "$APK"

          echo "APK BUILD AND ZIP TEST SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Fixed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
